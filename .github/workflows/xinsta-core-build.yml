name: Xinsta Core (macOS build + tests)

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/XinstaCore/**'
      - '.github/workflows/xinsta-core-build.yml'
  push:
    branches:
      - 'feature/xinsta-core'
    paths:
      - 'ios/XinstaCore/**'
      - '.github/workflows/xinsta-core-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unsigned dylib compile + Core tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version

      - name: Compile unsigned iOS dylib
        run: bash ios/XinstaCore/Scripts/build-dylib.sh

      - name: Run Foundation-only Core tests
        run: bash ios/XinstaCore/Scripts/run-tests.sh

      - name: Verify artifact is an arm64 iOS Mach-O dylib
        run: |
          set -euo pipefail
          ARTIFACT="ios/XinstaCore/build/libXinstaCore.dylib"
          test -f "$ARTIFACT"
          test -s "$ARTIFACT"
          file "$ARTIFACT"
          MACHO_HEADER="$(otool -hv "$ARTIFACT")"
          echo "$MACHO_HEADER"
          grep -q 'MH_MAGIC_64' <<<"$MACHO_HEADER"
          grep -q 'ARM64' <<<"$MACHO_HEADER"
          grep -q 'DYLIB' <<<"$MACHO_HEADER"
          LOAD_COMMANDS="$(otool -l "$ARTIFACT")"
          if grep -q 'LC_BUILD_VERSION' <<<"$LOAD_COMMANDS"; then
            grep -q 'platform IPHONEOS' <<<"$LOAD_COMMANDS"
          else
            grep -q 'LC_VERSION_MIN_IPHONEOS' <<<"$LOAD_COMMANDS"
          fi
          echo "Xinsta Core artifact verified: arm64 iOS Mach-O dylib"
